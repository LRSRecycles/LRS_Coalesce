id: "1"
macroString: |
  {% macro safe_divide(numerator, denominator, default='NULL') %}
    {#--
      Macro: safe_divide
      Purpose:
        Safely divide two numeric expressions without casting.
        Returns a fallback if the denominator is zero or NULL.

      Parameters:
        - numerator (string): Any numeric expression (e.g., 'SUM(amount)')
        - denominator (string): Any numeric expression (e.g., 'SUM(quantity)')
        - default (string, optional): Value to return if denominator is 0 or NULL. Defaults to NULL.

      Example:
        {{ safe_divide('SUM(DM05Z_AMNT)', 'SUM(DM05Z_QTY)', 'SUM(DM05Z_AMNT)') }} AS MT02_RATE
    --#}
    COALESCE(
      {{ numerator }} / NULLIF({{ denominator }}, 0),
      {{ default }}
    )
  {% endmacro %}

  {% macro build_trux_source_name(company_col, extras=None, uppercase_company=False) %}
      {%- if uppercase_company %}
          {%- set company_expr = 'UPPER(' ~ company_col ~ ')' %}
      {%- else %}
          {%- set company_expr = company_col %}
      {%- endif %}
      {%- set base = "'TRUX_' || " ~ company_expr ~ " || '_COMP_RAW'" %}
      {%- if extras and extras | length > 0 %}
          {# Create the pattern: || '-' || field for each field in extras #}
          {%- set joined = extras | map('string') | join(" || '-' || ") %}
          {{ base ~ " || '-' || " ~ joined }}
      {%- else %}
          {{ base }}
      {%- endif %}
  {% endmacro %}


  {% macro standard_dm05_fields(
      source_table,
      rec_type,
      sort,
      link,
      site,
      serv,
      tdte,
      amnt,
      qty,
      desc,
      code,
      rout,
      sequ,
      billf='NULL',
      billt='NULL',
      type='NULL',
      dste='NULL',
      ticket='NULL',
      uom='NULL',
      refn='NULL',
      rtype='NULL',
      adjr='NULL',
      uprice='0.000',
      upriceuom="''"
  ) %}
      {{ rec_type }} AS DM05_RECTYPE,
      {{ sort }} AS DM05_SORT,
      {{ link }} AS DM05_LINK,
      {{ site }} AS DM05_SSIT,
      {{ serv }} AS DM05_SERV,
      {{ tdte }} AS DM05_TDTE,
      {{ amnt }} AS DM05_AMNT,
      {{ qty }} AS DM05_QTY,
      {{ desc }} AS DM05_DESC,
      {{ code }} AS DM05_CODE,
      {{ rout }} AS DM05_ROUT,
      {{ sequ }} AS DM05_SEQU,
      {{ billf }} AS DM05_BILLF,
      {{ billt }} AS DM05_BILLT,
      {{ type }} AS DM05_TYPE,
      {{ dste }} AS DM05_DSTE,
      {{ ticket }} AS DM05_TICKET,
      {{ uom }} AS DM05_UOM,
      {{ refn }} AS DM05_REFN,
      {{ rtype }} AS DM05_RTYPE,
      {{ adjr }} AS DM05_ADJR,
      {{ uprice }} AS DM05_UPRICE,
      {{ upriceuom }} AS DM05_UPRICEUOM,
      {{ source_table }}."SOURCE" AS SOURCE
  {% endmacro %}

  {#--
    Macro: create_composite_key
    Purpose:
      Generate a standardized composite key by concatenating multiple columns or expressions
      with a configurable separator. Supports optional per-column date or text formatting
      through Snowflake’s TO_VARCHAR function.

    Parameters:
      - cols (list): List of column names or SQL expressions to combine.
                     Each element should be passed as a Jinja string, e.g.
                     '"TABLE"."COLUMN"' or 'CASE WHEN ... END'.
      - fmts (list, optional): Optional list of Snowflake date/time format strings
                               matching the order of `cols`. Set to 'YYYYMMDD' for dates,
                               or NULL for columns that don’t need formatting.
      - sep (string, optional): Separator used between concatenated values. Default is '-'.

    Notes:
      - Each value is wrapped with COALESCE(TO_VARCHAR(...), '') for safety.
      - NULLs become empty strings; the final key has no trailing separator.
      - Works with both quoted identifiers and complex SQL expressions.

    Example:
      {{ create_composite_key(
          cols=[
            '"VW_DISPOSAL_TICKET_BILLING_NORMALIZED"."SOURCE"',
            'CASE WHEN "STG_RM03_COMBINED"."RM03_WONU" IS NULL
                  THEN "VW_SM01_COMBINED"."SM01_WONU"
                  ELSE "STG_RM03_COMBINED"."RM03_WONU" END',
            '"VW_DISPOSAL_TICKET_BILLING_NORMALIZED"."TICKET_DATE"',
            '"VW_DISPOSAL_TICKET_BILLING_NORMALIZED"."ROUTE_NUMBER"',
            '"VW_DISPOSAL_TICKET_BILLING_NORMALIZED"."ROUTE_SEQUENCE_1"'
          ],
          fmts=[null, null, 'YYYYMMDD', null, null]
      ) }}
  --#}

  {% macro create_composite_key(cols=[], fmts=[], sep='-') %}
  (
    {%- for c in cols %}
      {%- set fmt = (fmts[loop.index0] if fmts and fmts|length > loop.index0 else none) -%}
      {%- if fmt %}
        COALESCE(TO_VARCHAR({{ c }}, '{{ fmt }}'), '')
      {%- else %}
        COALESCE(TO_VARCHAR({{ c }}), '')
      {%- endif %}
      {%- if not loop.last %} || '{{ sep }}' || {% endif %}
    {%- endfor %}
  )
  {% endmacro %}
name: macro
type: Macro
