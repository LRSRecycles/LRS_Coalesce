        join:
          joinCondition: |
            FROM {{ ref('OPERATIONS_DATA_MODEL', 'STG_CUSTOMER_SERVICE_STATISTICS') }} "STG_CUSTOMER_SERVICE_STATISTICS"
            INNER JOIN {{ ref('MASTER_DATA_CLEAN', 'FCT_DISPOSAL_TICKET_BILLING') }} "FCT_DISPOSAL_TICKET_BILLING"
                ON "FCT_DISPOSAL_TICKET_BILLING"."WORKORDER_KEY" = "STG_CUSTOMER_SERVICE_STATISTICS"."workorder_key"
            INNER JOIN {{ ref('MASTER_DATA_CLEAN',  'VW_CUSTOMER_SITE_MASTER') }} "VW_CUSTOMER_SITE_MASTER"
                ON "VW_CUSTOMER_SITE_MASTER"."Source_Customer_Site" = "STG_CUSTOMER_SERVICE_STATISTICS"."customer_site_key"
            INNER JOIN {{ ref('MASTER_DATA_CLEAN',  'VW_CUSTOMER_MASTER') }} "VW_CUSTOMER_MASTER"
                ON "VW_CUSTOMER_MASTER"."Source_Customer" = "STG_CUSTOMER_SERVICE_STATISTICS"."customer_key"
            WHERE "STG_CUSTOMER_SERVICE_STATISTICS"."Completed Date" IS NOT NULL
              AND "STG_CUSTOMER_SERVICE_STATISTICS"."Completed Date" >= DATEADD(month, -12, CURRENT_DATE)
              AND "STG_CUSTOMER_SERVICE_STATISTICS"."Work Order Number" > 0
