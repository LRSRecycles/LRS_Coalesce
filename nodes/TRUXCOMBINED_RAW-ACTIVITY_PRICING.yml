        dependencies:
          - locationName: TRUXCOMBINED_RAW
            nodeName: CM19_ACTIVITY_PRICING
          - locationName: TRUXCOMBINED_RAW
            nodeName: GET_CURRENT_PRICING
          - locationName: TRUXCOMBINED_RAW
            nodeName: GET_NEXT_PRICING_CHANGE
          - locationName: TRUXCOMBINED_RAW
            nodeName: GET_PRIOR_PRICING
          - locationName: TRUXCOMBINED_RAW
            nodeName: STG_CM12_COMBINED
        join:
          joinCondition: |-
            FROM {{ ref('TRUXCOMBINED_RAW', 'CM19_ACTIVITY_PRICING') }} CM19

            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'STG_CM12_COMBINED') }} CM12
            ON CM19_ACTV = CM12_CODE
            AND CM19."SOURCE" = CM12."SOURCE"

            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'GET_CURRENT_PRICING') }} CM19curr 
            ON  CM19curr.CM19_ACTV = CM19.CM19_ACTV 
            AND CM19curr.CM19_CUST = CM19.CM19_CUST 
            AND CM19curr.CM19_SITE = CM19.CM19_SITE
            AND CM19curr.CM19_SERV = CM19.CM19_SERV
            AND CM19curr.SOURCE = CM19.SOURCE

            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'GET_PRIOR_PRICING') }} CM19prior 
            ON  CM19prior.CM19_ACTV = CM19.CM19_ACTV 
            AND CM19prior.CM19_CUST = CM19.CM19_CUST 
            AND CM19prior.CM19_SITE = CM19.CM19_SITE
            AND CM19prior.CM19_SERV = CM19.CM19_SERV
            AND CM19prior.SOURCE = CM19.SOURCE

            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'GET_NEXT_PRICING_CHANGE') }} CM19next 
            ON  CM19next.CM19_ACTV = CM19.CM19_ACTV 
            AND CM19next.CM19_CUST = CM19.CM19_CUST 
            AND CM19next.CM19_SITE = CM19.CM19_SITE
            AND CM19next.CM19_SERV = CM19.CM19_SERV
            AND CM19next.SOURCE = CM19.SOURCE

            ORDER BY CM19.CM19_CUST, CM19.CM19_SITE, CM19.CM19_SERV, CM19.CM19_ACTV
