        join:
          joinCondition: |-

            FROM {{ ref('MASTER_DATA_CLEAN', 'FCT_DISPOSAL_TICKET_BILLING') }} "FCT_DISPOSAL_TICKET_BILLING"
            LEFT OUTER JOIN {{ ref('MASTER_DATA_CLEAN', 'VW_CUSTOMER_MASTER') }} "VW_CUSTOMER_MASTER" 
                ON "VW_CUSTOMER_MASTER"."Source" = "FCT_DISPOSAL_TICKET_BILLING"."SOURCE" AND "VW_CUSTOMER_MASTER"."Customer Number" = "FCT_DISPOSAL_TICKET_BILLING"."CUSTOMER_NUMBER"
            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'VW_LF05D_COMBINED') }} "VW_LF05D_COMBINED"
                ON "VW_LF05D_COMBINED".source="FCT_DISPOSAL_TICKET_BILLING"."SOURCE" AND "VW_LF05D_COMBINED".lf05d_id="FCT_DISPOSAL_TICKET_BILLING"."LF05ID"
            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'STG_LF05H_COMBINED') }} "STG_LF05H_COMBINED"
                ON "STG_LF05H_COMBINED".source="VW_LF05D_COMBINED".source AND "STG_LF05H_COMBINED".lf05h_id="VW_LF05D_COMBINED".lf05d_link
            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'STG_TR01LF_COMBINED') }} "STG_TR01LF_COMBINED"
                ON "STG_TR01LF_COMBINED".source=STG_LF05H_COMBINED.source AND  "STG_TR01LF_COMBINED".tr01lf_id=STG_LF05H_COMBINED.lf05h_truk
            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'STG_LF10H_COMBINED') }} "STG_LF10H_COMBINED"
                ON "STG_LF10H_COMBINED".source="VW_LF05D_COMBINED".source AND "STG_LF10H_COMBINED".lf10h_id="VW_LF05D_COMBINED".lf05d_job
            WHERE 
                "FCT_DISPOSAL_TICKET_BILLING"."SOURCE" = 'TRUX_HR_COMP_RAW'
                AND TICKET_DATE BETWEEN DATEADD('MONTH', -24, CURRENT_DATE()) AND CURRENT_DATE()
                AND MATERIAL_CODE = 'SM'
