    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: |
            {{ stage('Override Create SQL') }}
            CREATE OR REPLACE VIEW {{ ref('MASTER_DATA_CLEAN', 'VW_CUSTOMER_SITE_METRICS') }} AS (
            WITH latest_payment AS (
              SELECT
                "Source_Customer_Site" AS "source_customer_site",
                "Payment ID" AS "latest_payment_id",
                CAST("Transaction Date" AS DATE) AS "latest_payment_date",
                "Transaction Amount" * -1 AS "latest_payment_amount"
              FROM FINANCIAL_DATA_MODEL.VW_AR_INVOICE_TRANSACTION_WHALE
              WHERE "Transaction Type" = 'Payment'
                AND "Transaction Date" >= DATEADD(year, -1, CURRENT_DATE())
              QUALIFY ROW_NUMBER() OVER (
                PARTITION BY "Source_Customer_Site"
                ORDER BY "Transaction Date" DESC, "Payment ID" DESC
              ) = 1
            ),
            
            ar_aging AS (
              SELECT
                "Source_Customer_Site" AS "source_customer_site",
                SUM("Transaction Amount") AS "total_outstanding",
                SUM(CASE WHEN "days_since_due_date" < 0 THEN "Transaction Amount" ELSE 0 END) AS "current_balance",
                SUM(CASE WHEN "days_since_due_date" BETWEEN 0 AND 30 THEN "Transaction Amount" ELSE 0 END) AS "past_due_0_30",
                SUM(CASE WHEN "days_since_due_date" BETWEEN 31 AND 60 THEN "Transaction Amount" ELSE 0 END) AS "past_due_31_60",
                SUM(CASE WHEN "days_since_due_date" BETWEEN 61 AND 90 THEN "Transaction Amount" ELSE 0 END) AS "past_due_61_90",
                SUM(CASE WHEN "days_since_due_date" BETWEEN 91 AND 120 THEN "Transaction Amount" ELSE 0 END) AS "past_due_91_120",
                SUM(CASE WHEN "days_since_due_date" > 120 THEN "Transaction Amount" ELSE 0 END) AS "past_due_over_120"
              FROM FINANCIAL_DATA_MODEL.VW_AR_INVOICE_TRANSACTION_WHALE
              GROUP BY "Source_Customer_Site"
            )
            
            SELECT
              lp."source_customer_site",
              lp."latest_payment_id",
              lp."latest_payment_date",
              lp."latest_payment_amount",
              aa."total_outstanding",
              aa."current_balance",
              aa."past_due_0_30",
              aa."past_due_31_60",
              aa."past_due_61_90",
              aa."past_due_91_120",
              aa."past_due_over_120"
            FROM latest_payment lp
            LEFT JOIN ar_aging aa
              ON lp."source_customer_site" = aa."source_customer_site"
            )
        dependencies: []
        join:
          joinCondition: ""
        name: VW_CUSTOMER_SITE_METRICS
