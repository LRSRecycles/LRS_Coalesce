    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: |-
            {{ stage('Override Create SQL') }}
            	CREATE OR REPLACE VIEW {{ ref('FINANCIAL_DATA_MODEL', 'VW_CUSTOMER_SUSPEND_NP_TIMELINE')}} AS (
            WITH logs_filtered AS (
            SELECT
            	LOG_ID,
            	LOG_DATE,
            	LOG_USER,
            	LOG_TERMID,
            	LOG_CUST,
            	COALESCE(LOG_SITE, 0) AS LOG_SITE,
            	LOG_FNUM,
            	LOG_BVAL,
            	LOG_AVAL,
            	SOURCE
            FROM {{ ref('TRUXCOMBINED_RAW', 'TRUX_LOGS_COMBINED') }}
            WHERE LOG_FNUM IN (228, 229, 116, 117)
            ),
            
            reason_logs AS (
            SELECT *
            FROM logs_filtered
            WHERE LOG_FNUM IN (229, 117)
            	AND (LOG_BVAL IN ('NR', 'NP') OR LOG_AVAL IN ('NR', 'NP'))
            ),
            
            date_logs AS (
            SELECT *,
            	CASE
            	WHEN LENGTH(LOG_BVAL) > 10 THEN
            		CAST(TRY_TO_TIMESTAMP(LOG_BVAL, 'MM/DD/YYYY HH12:MI:SS AM') AS DATE)
            	ELSE
            		CAST(TRY_TO_DATE(LOG_BVAL, 'MM/DD/YYYY') AS DATE)
            	END AS parsed_bval,
            
            	CASE
            	WHEN LENGTH(LOG_AVAL) > 10 THEN
            		CAST(TRY_TO_TIMESTAMP(LOG_AVAL, 'MM/DD/YYYY HH12:MI:SS AM') AS DATE)
            	ELSE
            		CAST(TRY_TO_DATE(LOG_AVAL, 'MM/DD/YYYY') AS DATE)
            	END AS parsed_aval
            FROM logs_filtered
            WHERE LOG_FNUM IN(228, 116)
            ),
            
            paired_logs AS (
            SELECT
            	r.LOG_ID AS reason_log_id,
            	d.LOG_ID AS date_log_id,
            	r.LOG_DATE AS log_date,
            	r.LOG_USER,
            	r.LOG_TERMID,
            	r.LOG_CUST,
            	r.LOG_SITE,
            	r.SOURCE,
            
            	r.LOG_BVAL AS reason_before,
            	r.LOG_AVAL AS reason_after,
            	d.parsed_bval AS date_before,
            	d.parsed_aval AS date_after,
            
            	CASE 
            	WHEN r.LOG_AVAL IS NOT NULL THEN 'SUSPEND'
            	WHEN r.LOG_BVAL IS NOT NULL AND r.LOG_AVAL IS NULL THEN 'UNSUSPEND'
            	ELSE 'OTHER'
            	END AS action_type
            FROM reason_logs r
            LEFT JOIN date_logs d
            	ON r.LOG_USER = d.LOG_USER
            AND r.LOG_TERMID = d.LOG_TERMID
            AND r.LOG_CUST = d.LOG_CUST
            AND r.LOG_SITE = d.LOG_SITE
            AND r.SOURCE = d.SOURCE
            AND ABS(DATEDIFF(SECOND, r.LOG_DATE, d.LOG_DATE)) <= 5
            ),
            
            timeline_with_row AS (
            SELECT *,
            	ROW_NUMBER() OVER (
            	PARTITION BY LOG_CUST, LOG_SITE, SOURCE
            	ORDER BY log_date DESC
            	) AS timeline_row
            FROM paired_logs
            WHERE action_type IN ('SUSPEND', 'UNSUSPEND')
            )
            
            SELECT * FROM timeline_with_row
            )
        dependencies:
          - locationName: TRUXCOMBINED_RAW
            nodeName: TRUX_LOGS_COMBINED
        join:
          joinCondition: FROM {{ ref('TRUXCOMBINED_RAW', 'TRUX_LOGS_COMBINED') }} "TRUX_LOGS_COMBINED"
        name: VW_CUSTOMER_SUSPEND_NP_TIMELINE
        noLinkRefs: []
