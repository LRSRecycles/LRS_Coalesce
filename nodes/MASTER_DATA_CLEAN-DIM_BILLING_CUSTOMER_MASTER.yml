                  WHEN "CM04_COMBINED"."CM04_EDTE" IS NOT NULL 
                       AND "CM04_COMBINED"."CM04_SUSDATE" IS NOT NULL THEN 'Closed And Suspended'
                  WHEN "CM04_COMBINED"."CM04_EDTE" IS NOT NULL THEN 'Closed'
                  ELSE 'Suspended'
