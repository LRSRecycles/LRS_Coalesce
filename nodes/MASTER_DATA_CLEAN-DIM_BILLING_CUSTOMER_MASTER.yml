                  WHEN 'Vacation Hold' THEN 'Suspended'
                  WHEN 'Inactive - Pending Removal' THEN 'Suspended'
                  WHEN 'Vacant' THEN 'Closed'
                  WHEN 'Exempt from service' THEN 'Closed'
                  WHEN 'Pending Approval' THEN 'Closed'
                  WHEN 'Prospect' THEN 'Active'
