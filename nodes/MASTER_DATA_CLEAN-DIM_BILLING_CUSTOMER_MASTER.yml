              CASE "CUSTOMERSTATUSHISTORY_CURRENT"."STATUS"
                  WHEN 'Prospect' THEN 'Active'
                  WHEN 'Inactive' THEN 'Closed'
                  WHEN 'Active' THEN 'Active'
                  WHEN 'Credit Hold' THEN 'Suspended'
                  WHEN 'Collections - Internal' THEN 'Closed And Suspended'
                  WHEN 'Collections - External' THEN 'Closed And Suspended'
                  WHEN 'Write-off' THEN 'Closed'
                  ELSE 'Suspended'  -- Fallback for any unexpected values
              END
