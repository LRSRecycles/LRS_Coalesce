                  WHEN "CM03_COMBINED"."CM03_CDTE" IS NOT NULL 
                       AND "CM03_COMBINED"."CM03_SUSDATE" IS NOT NULL THEN 'Closed And Suspended'
                  WHEN "CM03_COMBINED"."CM03_CDTE" IS NOT NULL THEN 'Closed'
                  ELSE 'Suspended'
              END
          - columnReferences: []
            transform: |
              CASE 
                  WHEN "CM04_COMBINED"."CM04_EDTE" IS NULL 
