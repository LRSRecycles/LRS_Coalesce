        customSQL:
          customSQL: |-
            {{ stage('Override Create SQL') }}
            	CREATE OR REPLACE VIEW {{ ref('FINANCIAL_DATA_MODEL', 'VW_CUSTOMER_SUSPEND_NP_UNSUSPEND')}} AS (
            SELECT
              U.SOURCE,
              U.LOG_CUST,
              U.LOG_SITE,
              U.REASON_LOG_ID AS LOG_ID,
              CAST(U.LOG_DATE AS DATE) AS UNSUSPEND_DATE,
              U.LOG_USER AS UNSUSPENDED_USER,
              U.TIMELINE_ROW,
              S.LOG_USER AS SUSPEND_LOG_USER,
              S.DATE_AFTER AS SUSPEND_DATE,
              S.REASON_AFTER AS SUSPEND_REASON_CODE
            FROM {{ ref('FINANCIAL_DATA_MODEL', 'VW_CUSTOMER_SUSPEND_NP_TIMELINE') }} "U"
            LEFT JOIN {{ ref('FINANCIAL_DATA_MODEL', 'VW_CUSTOMER_SUSPEND_NP_TIMELINE') }} "S"
              ON u.LOG_CUST = s.LOG_CUST
             AND u.LOG_SITE = s.LOG_SITE
             AND u.SOURCE = s.SOURCE
             AND s.timeline_row = u.timeline_row + 1
            WHERE u.action_type = 'UNSUSPEND'
            	)
        dependencies:
          - locationName: FINANCIAL_DATA_MODEL
            nodeName: VW_CUSTOMER_SUSPEND_NP_TIMELINE
        join:
          joinCondition: |
            FROM {{ ref('FINANCIAL_DATA_MODEL', 'VW_CUSTOMER_SUSPEND_NP_TIMELINE') }} "U"
