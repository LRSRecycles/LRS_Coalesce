        dependencies:
          - locationName: TRUXCOMBINED_RAW
            nodeName: CM09_MATERIAL_PRICING
          - locationName: TRUXCOMBINED_RAW
            nodeName: CURRENT_MATERIAL_PRICING
          - locationName: TRUXCOMBINED_RAW
            nodeName: FUTURE_MATERIAL_PRICING
          - locationName: TRUXCOMBINED_RAW
            nodeName: PRIOR_MATERIAL_PRICING
          - locationName: TRUXCOMBINED_RAW
            nodeName: STG_LM01_COMBINED
          - locationName: TRUXCOMBINED_RAW
            nodeName: STG_LM04_COMBINED
        join:
          joinCondition: |-
            FROM {{ ref('TRUXCOMBINED_RAW', 'CM09_MATERIAL_PRICING') }} t1

            INNER JOIN {{ ref('TRUXCOMBINED_RAW', 'STG_LM04_COMBINED') }} LM04
            ON t1.CM09_MATL = LM04_CODE
            AND t1."SOURCE" = LM04."SOURCE"

            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'STG_LM01_COMBINED') }} LM01
            ON IFNULL(t1.CM09_DSTE,'zzz') = LM01_DSTE
            AND t1."SOURCE" = LM01."SOURCE"

            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'CURRENT_MATERIAL_PRICING') }} CM09curr 
            ON  CM09curr.CM09_CUST = t1.CM09_CUST 
            AND CM09curr.CM09_SITE = t1.CM09_SITE
            AND CM09curr.CM09_SERV = t1.CM09_SERV
            AND (IFNULL(CM09curr.CM09_SERV,0) = 0 
            OR   IFNULL(CM09curr.CM09_SERV,0) = t1.CM09_SERV)
            AND CM09curr.CM09_MATL = t1.CM09_MATL
            AND IFNULL(CM09curr.CM09_UOM ,'') = IFNULL(t1.CM09_UOM,'')
            AND IFNULL(CM09curr.CM09_DSTE,'') = IFNULL(t1.CM09_DSTE,'') 
            AND "CM09CURR"."SOURCE" = t1."SOURCE"

            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'PRIOR_MATERIAL_PRICING') }} CM09prior 
            ON  CM09prior.CM09_CUST = t1.CM09_CUST 
            AND CM09prior.CM09_SITE = t1.CM09_SITE
            AND (IFNULL(CM09prior.CM09_SERV,0) = 0 
            OR   IFNULL(CM09prior.CM09_SERV,0) = t1.CM09_SERV)
            AND CM09prior.CM09_MATL = t1.CM09_MATL
            AND IFNULL(CM09prior.CM09_UOM ,'') = IFNULL(t1.CM09_UOM,'')
            AND IFNULL(CM09prior.CM09_DSTE,'') = IFNULL(t1.CM09_DSTE,'') 
            AND CM09prior."SOURCE" = t1."SOURCE"

            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'FUTURE_MATERIAL_PRICING') }} CM09next 
            ON  CM09next.CM09_CUST = t1.CM09_CUST 
            AND CM09next.CM09_SITE = t1.CM09_SITE
            AND (IFNULL(CM09next.CM09_SERV,0) = 0 
            OR   IFNULL(CM09next.CM09_SERV,0) = t1.CM09_SERV)
            AND CM09next.CM09_MATL = t1.CM09_MATL
            AND IFNULL(CM09next.CM09_UOM ,'') = IFNULL(t1.CM09_UOM,'')
            AND IFNULL(CM09next.CM09_DSTE,'') = IFNULL(t1.CM09_DSTE,'') 
            AND CM09next."SOURCE" = t1."SOURCE"

            ORDER BY t1.CM09_CUST, t1.CM09_SITE, t1.CM09_SERV, t1.CM09_MATL, t1.CM09_UOM, t1.CM09_DSTE
