    sourceMapping:
      - aliases: {}
        customSQL:
          customSQL: |-
            {{ stage('Override Create SQL') }}
            	CREATE OR REPLACE VIEW {{ ref('FINANCIAL_DATA_MODEL', 'VW_ALDI_INVOICE_REPORT')}} AS (
            WITH aldi_customers AS (
                -- Define the exact customer-database combinations that belong to ALDI
                SELECT
                    27450 AS cust_num,
                    'TRUX_DC_COMP_RAW' AS "Source"
                UNION ALL
                SELECT
                    12995,
                    'TRUX_IC_COMP_RAW'
                UNION ALL
                SELECT
                    65199,
                    'TRUX_LR_COMP_RAW'
                UNION ALL
                    -- Note: 65199 is ONLY in LR for ALDI
                SELECT
                    16170,
                    'TRUX_MH_COMP_RAW'
                UNION ALL
                SELECT
                    66480,
                    'TRUX_MN_COMP_RAW'
                UNION ALL
                SELECT
                    5155,
                    'TRUX_NI_COMP_RAW'
                UNION ALL
                SELECT
                    6209,
                    'TRUX_RD_COMP_RAW'
                UNION ALL
                    -- Note: 6209 is ONLY in RD for ALDI
                SELECT
                    99440,
                    'TRUX_WA_COMP_RAW'
            ),
            route_days AS (
                SELECT
                    rm02.RM02_CUST,
                    rm02.RM02_SITE,
                    rm02.RM02_SERV,
                    rm02.SOURCE,
                    LISTAGG(
                        CASE
                            LEFT(CAST(rm02.RM02_NUMB AS VARCHAR), 1)
                            WHEN '1' THEN 'MON'
                            WHEN '2' THEN 'TUE'
                            WHEN '3' THEN 'WED'
                            WHEN '4' THEN 'THU'
                            WHEN '5' THEN 'FRI'
                            WHEN '6' THEN 'SAT'
                            WHEN '7' THEN 'SUN'
                            ELSE ''
                        END,
                        ' '
                    ) WITHIN GROUP (
                        ORDER BY
                            LEFT(CAST(rm02.RM02_NUMB AS VARCHAR), 1)
                    ) AS DAYS_OF_WEEK
                FROM
                    LRS_PRODUCTION.TRUX_COMBINED_RAW.STG_RM02_COMBINED rm02
                GROUP BY
                    rm02.RM02_CUST,
                    rm02.RM02_SITE,
                    rm02.RM02_SERV,
                    rm02.SOURCE
            ),
            InvoiceDetails as (
                SELECT
                    CAST(DATE_TRUNC('MONTH', "Invoice Date") as DATE) AS invoice_month,
                    CAST("Invoice Date" as DATE) as invoice_date,
                    CAST("Transaction Date" as DATE) as transaction_date,
                    "Source",
                    "Billing Customer Number",
                    "Service Site Number",
                    "Service Number",
                    "Charge Type Description",
                    "Amount",
                    "Quantity",
                    "Activity Description",
                    "Transaction Date",
                    "Billing Unit of Measure",
                    "Record UID",
                    "Link to Disposal Ticket",
                    Round("Amount" / NULLIF("Quantity", 0), 2) AS unit_price,
                FROM
                    lrs_production.trux_combined_raw.VW_DM05_COMBINED
            )
            SELECT
            	id."Source" as SOURCE,
            	id.invoice_month as INVOICE_MONTH,
                site."Site Name" AS ALDI_ID,
                transaction_date as TRANSACTION_DATE,
                COALESCE(site."Address 3", site."Address 2") AS ADDRESS,
                site."City" as CITY,
                site."State" as STATE,
                site."Zip" AS ZIP_CODE,
                sm."Service Type" as SERVICE_TYPE,
                sm."Service Week" || CASE
                    WHEN rd.DAYS_OF_WEEK IS NOT NULL THEN ' - ' || rd.DAYS_OF_WEEK
                    ELSE ''
                END AS SCHEDULE,
                sm."Container Quantity" as "QUANTITY_EQUIPMENT",
                sm."Container Size" || ' ' || sm."Container UOM" AS SIZE_UNIT_OF_MEASURE,
                id."Charge Type Description" AS CHARGE_TYPE,
                id."Activity Description" AS SERVICE_ACTIVITY,
                CASE
                    WHEN id."Activity Description" NOT IN (
                        'RO FINAL PICK-UP -NT',
                        'EXTRA SERVICE - NT',
                        'EQUIPMENT EXCHANGFE - NT',
                        'LOOSE YDS (TRASH)',
                        'CONTAINER TRAFFIC',
                        'DRY RUN - NT',
                        'DELIVERY - NT'
                    ) THEN 'PERMANENT'
                    ELSE 'TEMPORARY'
                END AS PERMANENT_OR_TEMPORARY_CHARGE,
                id."Billing Unit of Measure" as UNIT_OF_MEASURE,
                id."Quantity" as QUANTITY,
                id."Amount" AS CHARGES,
                id.unit_price as UNIT_PRICE,
                CONCAT(
                    'Monthly trash invoices for ',
                    site."Site Name",
                    ' ',
                    MONTHNAME(invoice_month),
                    ' ',
                    YEAR(invoice_month),
                    '.'
                ) AS BILL_DESCRIPTION
            FROM
                InvoiceDetails id
                INNER JOIN aldi_customers ac on id."Source" = ac."Source"
                AND ac.cust_num = id."Billing Customer Number"
                LEFT JOIN lrs_production.master_data_clean.vw_service_master sm on id."Source" = sm."Source"
                AND id."Billing Customer Number" = sm."Customer Number"
                AND id."Service Site Number" = sm."Site Number"
                AND id."Service Number" = sm."Service Number"
                LEFT JOIN lrs_production.master_data_clean.vw_customer_site_master site on id."Source" = site."Source"
                AND id."Billing Customer Number" = site."Customer Number"
                AND id."Service Site Number" = site."Site Number"
                LEFT JOIN route_days rd ON id."Billing Customer Number" = rd.RM02_CUST
                AND id."Service Site Number" = rd.RM02_SITE
                AND id."Service Number" = rd.RM02_SERV
                AND id."Source" = rd.SOURCE
            WHERE
                CHARGES <> 0
            )
        dependencies: []
        join:
          joinCondition: ""
        name: VW_ALDI_INVOICE_REPORT
        noLinkRefs: []
