        dependencies:
          - locationName: TRUXCOMBINED_RAW
            nodeName: ACTIVITY_AND_MATERIAL_PRICING
          - locationName: TRUXCOMBINED_RAW
            nodeName: AGGREGATED_SURCHARGE_CUSTOMER_MASTER
          - locationName: TRUXCOMBINED_RAW
            nodeName: CUSTOMER_MASTER_MASTER_LIST
          - locationName: TRUXCOMBINED_RAW
            nodeName: SITE_START_DATE
        join:
          joinCondition: |
            FROM {{ ref('TRUXCOMBINED_RAW', 'CUSTOMER_MASTER_MASTER_LIST') }} "CUSTOMER_MASTER_MASTER_LIST"
            
            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'ACTIVITY_AND_MATERIAL_PRICING') }} p1 
             ON p1.RATE_CUST = "CUSTOMER_MASTER_MASTER_LIST"."Customer Number"
            AND p1.RATE_SITE = "CUSTOMER_MASTER_MASTER_LIST"."Site Number" 
            AND p1.RATE_SERV = "CUSTOMER_MASTER_MASTER_LIST"."Service Number"
            AND p1."SOURCE" = "CUSTOMER_MASTER_MASTER_LIST"."SOURCE"
            
            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'AGGREGATED_SURCHARGE_CUSTOMER_MASTER') }} SurCust 
             ON SurCust.CM03_CUST = "CUSTOMER_MASTER_MASTER_LIST"."Customer Number"
            AND IFNULL(SurCust.CM04_SITE,0) = 0
            AND SurCust."SOURCE" = "CUSTOMER_MASTER_MASTER_LIST"."SOURCE"
            
            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'AGGREGATED_SURCHARGE_CUSTOMER_MASTER') }} SurSite 
             ON SurSite.CM03_CUST = "CUSTOMER_MASTER_MASTER_LIST"."Customer Number"
            AND SurSite.CM04_SITE = "CUSTOMER_MASTER_MASTER_LIST"."Site Number"
            AND SurSite.Source = "CUSTOMER_MASTER_MASTER_LIST".Source
            
            LEFT OUTER JOIN {{ ref('TRUXCOMBINED_RAW', 'SITE_START_DATE') }} SiteSD 
             ON "CUSTOMER_MASTER_MASTER_LIST"."Customer Number" = SiteSD.CM19_CUST
            AND "CUSTOMER_MASTER_MASTER_LIST"."Site Number" = SiteSD.CM19_SITE
            AND "CUSTOMER_MASTER_MASTER_LIST"."SOURCE" = SiteSD.Source
