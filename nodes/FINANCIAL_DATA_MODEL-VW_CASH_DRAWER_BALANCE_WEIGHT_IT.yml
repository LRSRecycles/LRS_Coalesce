        dependencies:
          - locationName: MASTER_DATA_CLEAN
            nodeName: TRUX_DATABASE_METADATA
          - locationName: TRUXCOMBINED_RAW
            nodeName: STG_CD02_COMBINED
          - locationName: TRUXCOMBINED_RAW
            nodeName: STG_LF05H_COMBINED
          - locationName: TRUXCOMBINED_RAW
            nodeName: VW_LF22_COMBINED
        join:
          joinCondition: |-
            FROM {{ ref('MASTER_DATA_CLEAN', 'TRUX_DATABASE_METADATA') }} "TRUX_DATABASE_METADATA"
            INNER JOIN {{ ref('TRUXCOMBINED_RAW', 'VW_LF22_COMBINED') }} "VW_LF22_COMBINED" ON "TRUX_DATABASE_METADATA"."SNOWFLAKE_NAME"="VW_LF22_COMBINED"."SOURCE"
            INNER JOIN {{ ref('TRUXCOMBINED_RAW', 'STG_LF05H_COMBINED') }} "STG_LF05H_COMBINED" ON "STG_LF05H_COMBINED"."SOURCE"="VW_LF22_COMBINED"."SOURCE" AND "VW_LF22_COMBINED"."LF22_LINK"="STG_LF05H_COMBINED"."LF05H_ID"
            INNER JOIN {{ ref('TRUXCOMBINED_RAW', 'STG_CD02_COMBINED') }} "STG_CD02_COMBINED" ON "STG_CD02_COMBINED"."SOURCE"="STG_LF05H_COMBINED"."SOURCE" AND "STG_CD02_COMBINED"."CD02_CODE"="VW_LF22_COMBINED"."LF22_PAYTYPE" AND "STG_LF05H_COMBINED"."LF05H_PAYT"="STG_CD02_COMBINED"."CD02_TYPE" AND "STG_LF05H_COMBINED"."LF05H_PAYC"="STG_CD02_COMBINED"."CD02_CODE"
            WHERE 
                "TRUX_DATABASE_METADATA"."Company Type"='WEIGH-IT'
                AND "STG_LF05H_COMBINED"."LF05H_NUMB" > 0 AND "STG_LF05H_COMBINED"."LF05H_CASH" = 1 
                AND "STG_LF05H_COMBINED"."LF05H_DTEO" >= DATEADD(MONTH, -12, CURRENT_TIMESTAMP)
                AND "VW_LF22_COMBINED"."LF22_PAID" > 0 AND "STG_CD02_COMBINED"."CD02_TYPE" = 'P'
        name: VW_CASH_DRAWER_BALANCE_WEIGHT_IT
        noLinkRefs: []
