          - locationName: MASTER_DATA_CLEAN
            nodeName: LOB_COLLECTIONS_MAPPING
          - locationName: MASTER_DATA_CLEAN
            nodeName: TRUX_DATABASE_METADATA
          - locationName: MASTER_DATA_CLEAN
            nodeName: VW_ROUTE_MASTER
          - locationName: OPERATIONS_DATA_MODEL
            nodeName: VW_ROUTE_PROFITABILITY
          - locationName: TRUXCOMBINED_RAW
            nodeName: SERVICES_AGGREGATE_ROUTE_STATISTICS_ADAPTIVE
        join:
          joinCondition: |
            FROM {{ ref('OPERATIONS_DATA_MODEL', 'VW_ROUTE_PROFITABILITY') }} VW_ROUTE_PROFITABILITY
            
            LEFT JOIN {{ ref('MASTER_DATA_CLEAN', 'VW_ROUTE_MASTER') }} VW_ROUTE_MASTER
                ON VW_ROUTE_PROFITABILITY.SOURCE || '-' || VW_ROUTE_PROFITABILITY."Route" = VW_ROUTE_MASTER."Source_Route_Number"
                
            LEFT JOIN {{ ref('MASTER_DATA_CLEAN', 'LOB_COLLECTIONS_MAPPING') }} LOB_COLLECTIONS_MAPPING
                ON VW_ROUTE_MASTER."Source" || '-' || VW_ROUTE_MASTER."Route Type" = LOB_COLLECTIONS_MAPPING.SOURCE || '-' || LOB_COLLECTIONS_MAPPING.ROUTE_TYPE_NUMBER
                
            LEFT JOIN {{ ref('TRUXCOMBINED_RAW', 'SERVICES_AGGREGATE_ROUTE_STATISTICS_ADAPTIVE') }} SERVICES_AGGREGATE_ROUTE_STATISTICS_ADAPTIVE
                ON VW_ROUTE_PROFITABILITY.SOURCE || '-' || VW_ROUTE_PROFITABILITY."Route" || '-' || VW_ROUTE_PROFITABILITY."Route Date" = SERVICES_AGGREGATE_ROUTE_STATISTICS_ADAPTIVE."Source_Route_RouteDate"
            
            LEFT JOIN {{ ref('MASTER_DATA_CLEAN', 'TRUX_DATABASE_METADATA') }} TRUX_DATABASE_METADATA
               ON VW_ROUTE_PROFITABILITY."SOURCE" = TRUX_DATABASE_METADATA."SNOWFLAKE_NAME"
            
            GROUP BY ALL
        name: VW_ROUTE_STATISTICS_ADAPTIVE
