        dependencies:
          - locationName: MASTER_DATA_CLEAN
            nodeName: TRUX_DATABASE_METADATA
          - locationName: TRUXCOMBINED_RAW
            nodeName: CONTACT_EMAILS
          - locationName: TRUXCOMBINED_RAW
            nodeName: CUSTOMER_CONTACT_LIST_CUSTOMER_MASTER
          - locationName: TRUXCOMBINED_RAW
            nodeName: MASTER_CUSTOMER_MASTER
        join:
          joinCondition: |-
            FROM {{ ref('TRUXCOMBINED_RAW', 'MASTER_CUSTOMER_MASTER') }} "MASTER_CUSTOMER_MASTER"

            LEFT JOIN {{ ref('MASTER_DATA_CLEAN', 'TRUX_DATABASE_METADATA') }} "TRUX_DATABASE_METADATA"
               ON "MASTER_CUSTOMER_MASTER"."SOURCE" = "TRUX_DATABASE_METADATA"."SNOWFLAKE_NAME"

            LEFT JOIN {{ ref('TRUXCOMBINED_RAW', 'CUSTOMER_CONTACT_LIST_CUSTOMER_MASTER') }} Contact
              ON "MASTER_CUSTOMER_MASTER"."Customer No." = Contact.CM04_CUST
             AND (
                   "MASTER_CUSTOMER_MASTER"."Site No." IS NULL
                OR "MASTER_CUSTOMER_MASTER"."Site No." = Contact.CM04_SITE
                 )
             AND "MASTER_CUSTOMER_MASTER"."SOURCE" = "CONTACT"."SOURCE"

            LEFT JOIN {{ ref('TRUXCOMBINED_RAW', 'CONTACT_EMAILS') }} Email
              ON "MASTER_CUSTOMER_MASTER"."Customer No." = Email."CC01_CUST"
             AND (
                   "MASTER_CUSTOMER_MASTER"."Site No." IS NULL
                OR "MASTER_CUSTOMER_MASTER"."Site No." = Email."CC01_SITE"
                 )
             AND "MASTER_CUSTOMER_MASTER"."SOURCE" = Email."SOURCE"

            GROUP BY ALL
