name: Refresh Data in Development

on:
  # Set a schedule using cron
  schedule:
  - cron: "0 0 * * *"
  
  # This option allows the workflow to be triggered manually
  workflow_dispatch:
  
env:
  COA_VERSION: latest # Versions released on NPM here: https://www.npmjs.com/package/@coalescesoftware/coa
  
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 24
    
    # Fetch coa config secret from GitHub Actions secret repository, then write coa config to a temporary file
    - name: Write COA Config
      run: |
        set -euo pipefail
        echo '${{ secrets.dev_refresh }}' > COA_CONFIG
    
    # Rehydrate Snowflake private key from base64 encoded secret
    - name: Create Snowflake private key file
      run: |
        set -euo pipefail
        echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64_DEV}}" | base64 -d > snowflake_rsa_key.p8
        chmod 600 snowflake_rsa_key.p8

    # Install Coalesce CLI tool, if not installed already
    - name: Install Coalesce CLI
      run: |
        set -euo pipefail
        npm list | grep "@coalescesoftware/coa@${{ env.COA_VERSION }}" || npm install @coalescesoftware/coa@${{ env.COA_VERSION }}

    # Execute coa CLI, starting coa refresh
    - name: Coalesce refresh (Development, key pair)
      run: |
        set -euo pipefail
        npx coa refresh --config COA_CONFIG --snowflakeKeyPairKey "$PWD/snowflake_rsa_key.p8"
